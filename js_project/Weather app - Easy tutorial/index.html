<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather app - Easy tutorial</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <main class="card">
     <div class="search">
      <input type="checkbox" id="check">
      <input type="text" placeholder="masukkan nama kota">
       <label for="check">
          <img src="images/search.png" alt="search-icon">
       </label>
    </div> 
    <article class="weather">
      <img src="images/rain.png" alt="weather-icon" class="weather-icon">
      <h1 class="temp">33°C</h1>
      <h2 class="kota">New york</h2>
      <section class="details">
        
        <article class="col">
          <img src="images/humidity.png" alt="humidity-icon">
          <section class="status">
            <p class="humidity">50%</p>
            <p>humidity</p>
          </section>
        </article>
        <article class="col">
          <img src="images/wind.png" alt="humidity-icon">
          <section class="status">
            <p class="wind">15 km/h</p>
            <p>wind speed</p>
          </section>
        </article>
        
      </section>
    </article>
  </main>

<script>
  
</script>
</body>
</html>
